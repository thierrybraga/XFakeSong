name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Princípio do menor privilégio: jobs de CI só leem o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff) — advisório
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      # Advisório: a base ainda não está 100% lint-clean. `--exit-zero` mantém
      # o job verde e publica os achados como anotações no PR (sem bloquear).
      # O workflow release-gate.yml executa o lint sem --exit-zero.
      - run: ruff check app tests benchmarks tools --output-format=github --exit-zero

  test:
    name: Testes + cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XFAKE_API_ONLY: "1"        # evita carregar GPU/Gradio no import
      MPLBACKEND: Agg            # matplotlib headless
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Suíte rápida (exclui smoke) + cobertura
        run: bash tools/ops/run_tests.sh cov

  security:
    name: Segurança (Bandit bloqueia HIGH + auditoria runtime advisória)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install bandit pip-audit
      - name: Bandit (SAST — falha em severidade HIGH)
        run: bandit -r app benchmarks tools -lll
      - name: pip-audit (CVEs do runtime — advisório; release usa gate estrito)
        continue-on-error: true
        run: pip-audit -r requirements.txt

  docs:
    name: Docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-docs.txt
      - name: Build estrito
        run: mkdocs build --strict --clean
      - name: Validar links locais e fragmentos
        run: python tools/ops/check_docs_site.py infrastructure/site

  docker:
    name: Docker build/config
    # Só em PR: valida o Dockerfile sem gastar minutos a cada push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build da imagem (TF_VARIANT=cpu)
        run: docker build --build-arg TF_VARIANT=cpu -t speechchecker:ci .
      - name: Validar compose segmentado
        # Os perfis de inferência recusam subir sem credenciais e origens
        # explícitas (fail-closed). Aqui só se valida a configuração: valores
        # fictícios, definidos apenas neste passo, sem segredo nenhum.
        env:
          XFAKESONG_API_KEY: ci-validacao-sem-segredo
          XFAKE_GRADIO_USERNAME: ci-validacao
          XFAKE_GRADIO_PASSWORD: ci-validacao-sem-segredo
          ALLOWED_HOSTS: localhost
          ALLOWED_ORIGINS: http://localhost
        run: |
          python tools/ops/docker_build.py inference-cpu config
          python tools/ops/docker_build.py train-cpu config
          python tools/ops/docker_build.py train-nvidia config
          python tools/ops/docker_build.py benchmark-nvidia config
