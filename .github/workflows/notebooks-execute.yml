name: Notebooks — executar + renderizar HTML

# Executa notebooks auxiliares (nbconvert --execute) e publica HTML como
# artefato. Os resultados sintéticos destes notebooks não são os resultados do
# estudo CETUC–XTTS-v2 nem validam a proveniência das métricas do artigo.
# Manual por padrão (workflow_dispatch) para não gastar minutos a cada push;
# habilite o `schedule` quando quiser cadência semanal.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * 1"   # segunda 06:00 UTC

permissions:
  contents: read

jobs:
  render:
    name: Executar + renderizar (self-contained)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      XFAKE_API_ONLY: "1"
      # Exercita treino e métricas sintéticas durante a renderização; isso não é
      # uma reprodução do experimento nem uma fonte de resultados acadêmicos.
      XFAKE_RUN_EVAL: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-notebooks.txt
      - name: Executar + renderizar para HTML
        run: |
          mkdir -p rendered
          jupyter nbconvert --to html --execute \
            --ExecutePreprocessor.timeout=600 \
            --output-dir rendered \
            docs/notebooks/00_index.ipynb \
            docs/notebooks/features/01_feature_extraction_study.ipynb \
            docs/notebooks/models/03_rawnet2.ipynb \
            docs/notebooks/models/11_multiscale_cnn.ipynb \
            docs/notebooks/models/13_svm.ipynb \
            docs/notebooks/models/14_random_forest.ipynb \
            docs/notebooks/pipeline/01_benchmark_tcc_full_pipeline.ipynb \
            docs/notebooks/pipeline/02_training_model.ipynb \
            docs/notebooks/pipeline/03_inference.ipynb
      - name: Publicar HTML como artefato
        uses: actions/upload-artifact@v7
        with:
          name: notebooks-html
          path: rendered/
          if-no-files-found: error
