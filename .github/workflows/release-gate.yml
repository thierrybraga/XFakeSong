name: Release gates

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-compatibility:
    name: Dependências — Python ${{ matrix.python-version }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        profile: ["requirements.txt", "requirements-cpu.txt"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ${{ matrix.profile }}
            requirements-base.txt
            constraints.txt
      - name: Resolver perfil e validar dependências instaladas
        # constraints.txt é o que as imagens usam (PIP_CONSTRAINT): testar sem ele
        # aprovaria um ambiente diferente do publicado.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ matrix.profile }}" -c constraints.txt
          python -m pip check

  quality:
    name: Qualidade, segurança, documentação e container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      XFAKE_API_ONLY: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-base.txt
            requirements.txt
            requirements-dev.txt
            requirements-docs.txt
            requirements-notebooks.txt
            requirements-xai.txt
            requirements-experiments.txt
            constraints.txt
      - name: Instalar todos os perfis publicados
        # O pip-audit também audita pip e setuptools, e o setuptools que vem com o
        # Python do runner é antigo o bastante para reprovar o gate.
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -c constraints.txt \
            -r requirements-notebooks.txt \
            -r requirements-docs.txt \
            -r requirements-xai.txt \
            -r requirements-experiments.txt
          python -m pip check
      - name: Ruff — sem achados na release
        run: ruff check app tests benchmarks tools
      - name: Testes rápidos + relatório de cobertura
        run: bash tools/ops/run_tests.sh cov
      - name: Bandit — bloquear achados HIGH
        run: bandit -r app benchmarks tools -lll
      - name: pip-audit — bloquear o que a lista de exceções não cobre
        run: python tools/ops/check_pip_audit.py
      - name: MkDocs — build estrito
        run: |
          mkdocs build --strict --clean
          python tools/ops/check_docs_site.py infrastructure/site
      - name: Build da imagem de publicação CPU
        run: docker build --build-arg TF_VARIANT=cpu -t speechchecker:release-gate .
      - name: Validar perfis Compose
        # Os perfis de inferência recusam subir sem credenciais e origens
        # explícitas (fail-closed). Aqui só se valida a configuração: valores
        # fictícios, definidos apenas neste passo, sem segredo nenhum.
        env:
          XFAKESONG_API_KEY: ci-validacao-sem-segredo
          XFAKE_GRADIO_USERNAME: ci-validacao
          XFAKE_GRADIO_PASSWORD: ci-validacao-sem-segredo
          ALLOWED_HOSTS: localhost
          ALLOWED_ORIGINS: http://localhost
        run: |
          python tools/ops/docker_build.py inference-cpu config
          python tools/ops/docker_build.py inference-nvidia config
          python tools/ops/docker_build.py train-cpu config
          python tools/ops/docker_build.py train-nvidia config
          python tools/ops/docker_build.py benchmark-nvidia config
