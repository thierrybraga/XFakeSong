version: 2
updates:
  # Dependabot acompanha manifests requirements*.txt na raiz.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # Requirements isolados dos ambientes de container também recebem updates.
  - package-ecosystem: pip
    directory: "/infrastructure/docker/environments/classical-ml"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: pip
    directory: "/infrastructure/docker/environments/inference-api"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: pip
    directory: "/infrastructure/docker/environments/pytorch-audio"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: pip
    directory: "/infrastructure/docker/environments/ssl-transformers"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: pip
    directory: "/infrastructure/docker/environments/tensorflow-keras"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # Actions usadas nos workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
