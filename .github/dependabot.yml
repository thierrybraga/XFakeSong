version: 2
updates:
  # Dependabot acompanha manifests requirements*.txt na raiz.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # transformers 5 exige validar as imagens: o constraints.txt fixa 4.45.2, e um
      # pino diferente em um só ambiente quebra o build daquela imagem.
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  # Requirements isolados dos ambientes de container também recebem updates.
  - package-ecosystem: pip
    directory: "/infrastructure/docker/environments/classical-ml"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: pip
