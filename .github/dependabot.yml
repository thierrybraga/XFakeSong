    ignore:
      # transformers 5 exige validar as imagens: o constraints.txt fixa 4.45.2, e um
      # pino diferente em um só ambiente quebra o build daquela imagem.
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: pip
    directory: "/infrastructure/docker/environments/tensorflow-keras"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # transformers 5 exige validar as imagens: o constraints.txt fixa 4.45.2, e um
      # pino diferente em um só ambiente quebra o build daquela imagem.
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  # Actions usadas nos workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
