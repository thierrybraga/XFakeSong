# Classical ML benchmark preset.

family: classical-ml
# ordem por custo crescente (ver benchmarks/config.py::ALL_TCC_ARCHITECTURES)
models:
  - RandomForest
  - SVM
# Dataset canonico: data/datasets/ (raiz consolidada em 2026-07-14; app/datasets foi descontinuado).
dataset: data/datasets/benchmark_audio_raw_balanced_15k.npz
output_dir: results/classical_benchmark
models_dir: app/models
epochs: 100
batch_size: 32
device_profile: cpu
latency_runs: 30
snr: [30, 20, 10]
optimize_hyperparameters: true

