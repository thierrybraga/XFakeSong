family: retune-extended
scope: extended
models:
  - Ensemble
  - EfficientNet-LSTM
dataset: data/datasets/benchmark_dataset.npz
output_dir: data/results/retune_extended
epochs: 100
batch_size: 16
device_profile: gpu
latency_runs: 30
# Avaliacao: 30/20/10 casam com o augmentation de treino (condicao
# CASADA) e 5 dB fica FORA do treino — o unico nivel que mede
# generalizacao a ruido. Ver docs/evaluation/benchmark.md.
snr: [30, 20, 10, 5]
optimize_hyperparameters: false
academic_protocol: false