family: waveform-end-to-end
scope: official
# Os tres modelos que OFFICIAL_TCC_MODEL_MANIFEST declara com
# family: waveform-end-to-end. O RawNet2 faltava aqui, entao a rota por familia
# (make train-pytorch / train_by_family.py) treinava 2 de 3 e os presets cobriam
# 13 das 14 arquiteturas. Ordem igual a do manifesto em benchmarks/config.py.
models:
  - RawNet2
  - AASIST
  - RawGAT-ST
output_dir: data/results/families/waveform_end_to_end
batch_size: 16
device_profile: gpu
dataset: data/datasets/benchmark_dataset.npz
models_dir: data/models
epochs: 100
latency_runs: 30
# Avaliacao: 30/20/10 casam com o augmentation de treino (condicao
# CASADA) e 5 dB fica FORA do treino — o unico nivel que mede
# generalizacao a ruido. Ver docs/evaluation/benchmark.md.
snr: [30, 20, 10, 5]
optimize_hyperparameters: true
academic_protocol: true
