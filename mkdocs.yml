site_name: SpeechChecker
site_description: Plataforma Open Source de Inteligência Artificial para detecção de deepfakes de áudio e forense digital.
site_author: SpeechChecker Team
site_url: https://thierrybraga.github.io/XFakeSong/
site_dir: infrastructure/site
use_directory_urls: true
repo_url: https://github.com/thierrybraga/XFakeSong
repo_name: thierrybraga/XFakeSong
edit_uri: edit/main/docs/

# README.md é o guia de navegação da PASTA docs/ no GitHub; o site usa index.md.
exclude_docs: |
  README.md
  notebooks/README.md

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
    - content.code.copy
    - content.action.edit
    - content.action.view
    - content.tooltips
  palette:
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo escuro
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Mudar para modo claro
  # Usa fontes do sistema para evitar requisições a Google Fonts.
  font: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/thierrybraga/XFakeSong
      name: SpeechChecker no GitHub
    - icon: fontawesome/brands/python
      link: https://python.org
      name: Python
  generator: false

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Comece:
    - Conceitos e Fundamentos: getting-started/concepts.md
    - Introdução: getting-started/introduction.md
    - Instalação e Configuração: getting-started/installation.md
    - Guia Google Colab: getting-started/google-colab.md
    - Perguntas Frequentes (FAQ): reference/faq.md
  - Produto:
    - Interface e API:
      - Interface Gradio: interfaces/gradio.md
      - API REST: interfaces/rest-api.md
    - Arquitetura:
      - Visão Geral: architecture/overview.md
      - Arquitetura Modular: architecture/modular-architecture.md
      - Módulos: architecture/modules.md
      - Estrutura de Pastas: architecture/folder-structure.md
      - Auditoria e Organização: architecture/project-structure.md
      - Padrões Arquiteturais: architecture/patterns.md
      - Grafo de Dependências: architecture/dependency-graph.md
      - Features de Áudio: architecture/audio-features.md
    - Modelos:
      - Arquiteturas Neurais: models/architectures.md
      - Revisão Técnica: models/literature-review.md
      - Inferência: models/inference.md
      - Treinamento: models/training.md
    - Dados:
      - Pipeline e Auditoria: data/pipeline-and-audit.md
      - Datasets Públicos: data/public-datasets.md
    - Publicação:
      - Hugging Face Spaces: deployment/hugging-face-spaces.md
      - GitHub Pages e Hugging Face: deployment/github-pages-and-hugging-face.md
  - Pesquisa e TCC:
    - Estudo Canônico e Inventário de Legado: evaluation/canonical-study-and-legacy-inventory.md
    - Auditoria de Dataset e Modelos: evaluation/model-dataset-artifact-audit.md
    - Benchmark e Resultados: evaluation/benchmark.md
    - Protocolo de Dataset: data/dataset-protocol.md
    - Dataset Avaliado: data/benchmark-dataset.md
    - Histórico e apoio:
      - Estudo Experimental: evaluation/experimental-study.md
      - Protocolo Final de ML: evaluation/final-ml-protocol.md
      - Guia de Notebooks: evaluation/notebooks.md
      - Retreino com Ajustes: evaluation/retraining-adjustments.md
      - Retreino em WSL2: evaluation/retraining-wsl2.md
      - Auditoria do Pipeline: evaluation/pipeline-audit.md
      - Plano de Retreino: archive/retraining-plan.md
      - Plano de Correções do Benchmark: archive/benchmark-corrections-plan.md
  - Desenvolvimento:
    - Guia do Desenvolvedor: development/developer-guide.md
    - Plano de Auditoria e Adequação: development/public-release-and-tcc-audit-plan.md
    - Plano de Refatoração: development/refactoring-action-plan.md
    - Padrão da Documentação: development/documentation-guidelines.md
    - Padrões de Código: development/coding-standards.md
    - Convenções: development/conventions.md
    - Qualidade e Testes: development/quality-and-testing.md
    - Dependências e Gates de Release: development/release-gates.md
    - Registro da Revisão de Release: development/release-review.md
    - CI/CD e Segurança: development/ci-cd-and-security.md
    - Ambientes Docker: development/docker-environments.md
    - Histórico de organização:
      - Relatório de Refatoração: archive/refactoring-report.md
      - Plano de Ambientes de Treinamento: archive/training-environments-plan.md
  - Referência e comunidade:
    - Glossário: reference/glossary.md
    - Contribuir: https://github.com/thierrybraga/XFakeSong/blob/main/CONTRIBUTING.md
    - Código de Conduta: https://github.com/thierrybraga/XFakeSong/blob/main/CODE_OF_CONDUCT.md
    - Política de Segurança: https://github.com/thierrybraga/XFakeSong/blob/main/SECURITY.md
