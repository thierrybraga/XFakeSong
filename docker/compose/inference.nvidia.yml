name: xfakesong-inference-nvidia

services:
  inference-api:
    build:
      context: ../..
      dockerfile: docker/environments/inference-api/Dockerfile.nvidia
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    image: xfakesong/inference-api:nvidia
    container_name: xfakesong_inference_nvidia
    working_dir: /app
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM
    ports:
      - "${GRADIO_PORT:-7860}:7860"
    volumes:
      - ../../data/models:/app/data/models
      - ../../data/datasets:/app/data/datasets
      - ../../data/results:/app/data/results
      - ../../data:/app/data
      - ../../cache/huggingface:/app/cache/huggingface
      - ../../cache/torch:/app/cache/torch
    environment:
      DEEPFAKE_ENV: ${DEEPFAKE_ENV:-production}
      DEEPFAKE_LOG_LEVEL: ${DEEPFAKE_LOG_LEVEL:-INFO}
      XFAKESONG_API_KEY: "${XFAKESONG_API_KEY:?Defina XFAKESONG_API_KEY}"
      XFAKE_GRADIO_USERNAME: "${XFAKE_GRADIO_USERNAME:?Defina XFAKE_GRADIO_USERNAME}"
      XFAKE_GRADIO_PASSWORD: "${XFAKE_GRADIO_PASSWORD:?Defina XFAKE_GRADIO_PASSWORD}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:?Defina ALLOWED_HOSTS}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:?Defina ALLOWED_ORIGINS}"
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: "7860"
      GRADIO_ANALYTICS_ENABLED: "False"
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_FORCE_GPU_ALLOW_GROWTH: "true"
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      DATABASE_URL: sqlite:////app/data/app.db
      DEEPFAKE_UPLOADS_DIR: /app/data/uploads
      DEEPFAKE_MODELS_DIR: /app/data/models
      # Producao serve APENAS os 11 modelos promovidos em benchmark_final/;
      # sem isso o boot fabrica um SVM default destreinado na raiz de
      # data/models (visto em 2026-07-19), que pode sombrear o SVM promovido.
      XFAKE_CREATE_DEFAULT_MODELS: "false"
      HF_HOME: /app/cache/huggingface
      TORCH_HOME: /app/cache/torch
    deploy:
      resources:
        limits:
          cpus: "${DOCKER_CPU_LIMIT:-4.0}"
          memory: ${DOCKER_MEMORY_LIMIT:-8G}
        reservations:
          devices:
            - driver: nvidia
              count: ${NVIDIA_GPU_COUNT:-all}
              capabilities: [gpu, compute, utility]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: ["python", "main.py", "--gradio", "--gradio-port", "7860"]
