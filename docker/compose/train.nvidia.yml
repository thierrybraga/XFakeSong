name: xfakesong-train-nvidia

x-train-common: &train-common
  working_dir: /app
  shm_size: 2gb
  volumes:
    - ../..:/app
    - ../../cache/huggingface:/app/cache/huggingface
    - ../../cache/torch:/app/cache/torch
    - ../../cache/tensorflow:/app/cache/tensorflow
  environment:
    DEEPFAKE_ENV: benchmark
    DEEPFAKE_LOG_LEVEL: ${DEEPFAKE_LOG_LEVEL:-INFO}
    PYTHONIOENCODING: utf-8
    TF_CPP_MIN_LOG_LEVEL: "2"
    TF_FORCE_GPU_ALLOW_GROWTH: "true"
    TF_GPU_ALLOCATOR: cuda_malloc_async
    GRADIO_ANALYTICS_ENABLED: "False"
    NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
    DATABASE_URL: sqlite:////app/data/app.db
    DEEPFAKE_UPLOADS_DIR: /app/data/uploads
    DEEPFAKE_MODELS_DIR: /app/data/models
    HF_HOME: /app/cache/huggingface
    TORCH_HOME: /app/cache/torch
    XFAKE_SYNC_MODELS_ON_BOOT: "false"
    XFAKE_CREATE_DEFAULT_MODELS: "false"
    XFAKE_TRAIN_BATCH_LOG_INTERVAL_S: ${XFAKE_TRAIN_BATCH_LOG_INTERVAL_S:-60}
  deploy:
    resources:
      limits:
        cpus: "${DOCKER_TRAIN_CPU_LIMIT:-8.0}"
        memory: ${DOCKER_TRAIN_MEMORY_LIMIT:-16G}
      reservations:
        devices:
          - driver: nvidia
            count: ${NVIDIA_GPU_COUNT:-all}
            capabilities: [gpu, compute, utility]
  healthcheck:
    disable: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  classical-ml:
    <<: *train-common
    build:
      context: ../..
      dockerfile: docker/environments/classical-ml/Dockerfile.cpu
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    image: xfakesong/classical-ml:cpu
    container_name: xfakesong_classical_ml_cpu
    command: ["python", "scripts/training/train_by_family.py", "--family", "classical-tabular", "--device-profile", "cpu"]

  tensorflow-keras:
    <<: *train-common
    build:
      context: ../..
      dockerfile: docker/environments/tensorflow-keras/Dockerfile.nvidia
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    image: xfakesong/tensorflow-keras:nvidia
    container_name: xfakesong_tensorflow_keras_nvidia
    command: ["python", "scripts/training/train_by_family.py", "--family", "spectral-attention", "--device-profile", "gpu"]

  pytorch-audio:
    <<: *train-common
    build:
      context: ../..
      dockerfile: docker/environments/pytorch-audio/Dockerfile.nvidia
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    image: xfakesong/pytorch-audio:nvidia
    container_name: xfakesong_pytorch_audio_nvidia
    command: ["python", "scripts/training/train_by_family.py", "--family", "waveform-end-to-end", "--device-profile", "gpu"]

  spectral-convolutional:
    <<: *train-common
    build:
      context: ../..
      dockerfile: docker/environments/tensorflow-keras/Dockerfile.nvidia
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    image: xfakesong/tensorflow-keras:nvidia
    container_name: xfakesong_spectral_convolutional_nvidia
    command: ["python", "scripts/training/train_by_family.py", "--family", "spectral-convolutional", "--device-profile", "gpu"]

  extended:
    <<: *train-common
    build:
      context: ../..
      dockerfile: docker/environments/tensorflow-keras/Dockerfile.nvidia
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    image: xfakesong/tensorflow-keras:nvidia
    container_name: xfakesong_extended_nvidia
    command: ["python", "scripts/training/train_by_family.py", "--family", "extended", "--device-profile", "gpu"]
  ssl-transformers:
    <<: *train-common
    build:
      context: ../..
      dockerfile: docker/environments/ssl-transformers/Dockerfile.nvidia
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    image: xfakesong/ssl-transformers:nvidia
    container_name: xfakesong_ssl_transformers_nvidia
    command: ["python", "scripts/training/train_by_family.py", "--family", "ssl-pretrained", "--device-profile", "gpu"]
