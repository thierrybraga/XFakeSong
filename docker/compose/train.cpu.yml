name: xfakesong-train-cpu

x-train-common: &train-common
  working_dir: /app
  # 64 MB (o default do Docker) contra os 2 GB que benchmark.nvidia.yml e
  # train.nvidia.yml ja davam para a MESMA carga. Os classicos rodam
  # GridSearchCV com n_jobs=-1 (svm.py, random_forest.py) e o joblib
  # memmapeia os arrays grandes por /dev/shm; sem espaco ele cai para /tmp
  # no disco, silenciosamente e muito mais devagar.
  shm_size: 2gb
  volumes:
    - ../..:/app
    - ../../cache/huggingface:/app/cache/huggingface
    - ../../cache/torch:/app/cache/torch
    - ../../cache/tensorflow:/app/cache/tensorflow
  environment:
    DEEPFAKE_ENV: benchmark
    DEEPFAKE_LOG_LEVEL: ${DEEPFAKE_LOG_LEVEL:-INFO}
    PYTHONIOENCODING: utf-8
    TF_CPP_MIN_LOG_LEVEL: "2"
    GRADIO_ANALYTICS_ENABLED: "False"
    DATABASE_URL: sqlite:////app/data/app.db
    DEEPFAKE_UPLOADS_DIR: /app/data/uploads
    DEEPFAKE_MODELS_DIR: /app/data/models
    HF_HOME: /app/cache/huggingface
    TORCH_HOME: /app/cache/torch
    XFAKE_SYNC_MODELS_ON_BOOT: "false"
    XFAKE_CREATE_DEFAULT_MODELS: "false"
    XFAKE_TRAIN_BATCH_LOG_INTERVAL_S: ${XFAKE_TRAIN_BATCH_LOG_INTERVAL_S:-60}
    # As XFAKE_ENABLE_* de app/core/performance.py NAO chegavam ao container:
    # --env-file so disponibiliza a variavel para substituicao ${...} no YAML,
    # nao injeta no processo -- so o que esta listado aqui vira env var de
    # verdade dentro do container. O .env ja declarava as tres como true, mas
    # `enable_tf32` cai no default False quando ausente, entao o treino rodava
    # SEM TF32 (a RTX 3060/Ampere acelera os modelos que rodam em float32
    # puro). Corrigido no benchmark.nvidia.yml em 2026-08-13 e NAO propagado
    # para o treino ate agora.
    XFAKE_ENABLE_TF32: ${XFAKE_ENABLE_TF32:-false}
    XFAKE_ENABLE_XLA: ${XFAKE_ENABLE_XLA:-true}
    XFAKE_ENABLE_ONEDNN: ${XFAKE_ENABLE_ONEDNN:-true}
  deploy:
    resources:
      limits:
        cpus: "${DOCKER_TRAIN_CPU_LIMIT:-8.0}"
        memory: ${DOCKER_TRAIN_MEMORY_LIMIT:-16G}
  # Retomada apos queda: mesma politica do benchmark.nvidia.yml. O comando
  # termina com exit 0 so quando todas as arquiteturas ficam "ok", entao
  # on-failure nao reinicia um sweep bem-sucedido. O --resume no command faz o
  # orquestrador pular as concluidas, e o BackupAndRestore por epoca (dentro
  # do volume montado) devolve a arquitetura em curso na epoca onde parou --
  # verificado sob SIGKILL em 2026-08-19.
  restart: on-failure:10
  # 10 s (o default) e pouco para um `docker stop` durante a gravacao do
  # checkpoint de fim de epoca: o SIGKILL chegava no meio da escrita. Nao e
  # perda total (double_checkpoint=True mantem o anterior), mas custa uma
  # epoca sem necessidade.
  stop_grace_period: 120s
  healthcheck:
    disable: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  classical-ml:
    <<: *train-common
    build:
      context: ../..
      dockerfile: docker/environments/classical-ml/Dockerfile.cpu
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    image: xfakesong/classical-ml:cpu
    container_name: xfakesong_classical_ml_cpu
    # --resume: sem ele o `restart: on-failure` do bloco comum refazia as
    # arquiteturas JA concluidas a cada retomada, tornando a politica de
    # restart pior que nenhuma. Mesmo motivo documentado em
    # benchmark.nvidia.yml.
    command: ["python", "scripts/training/train_by_family.py", "--family", "classical-tabular", "--resume"]

  tensorflow-keras:
    <<: *train-common
    build:
      context: ../..
      dockerfile: docker/environments/tensorflow-keras/Dockerfile.cpu
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    image: xfakesong/tensorflow-keras:cpu
    container_name: xfakesong_tensorflow_keras_cpu
    # --resume: sem ele o `restart: on-failure` do bloco comum refazia as
    # arquiteturas JA concluidas a cada retomada, tornando a politica de
    # restart pior que nenhuma. Mesmo motivo documentado em
    # benchmark.nvidia.yml.
    command: ["python", "scripts/training/train_by_family.py", "--family", "spectral-attention", "--device-profile", "cpu", "--resume"]

  pytorch-audio:
    <<: *train-common
    build:
      context: ../..
      dockerfile: docker/environments/pytorch-audio/Dockerfile.cpu
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    image: xfakesong/pytorch-audio:cpu
    container_name: xfakesong_pytorch_audio_cpu
    # --resume: sem ele o `restart: on-failure` do bloco comum refazia as
    # arquiteturas JA concluidas a cada retomada, tornando a politica de
    # restart pior que nenhuma. Mesmo motivo documentado em
    # benchmark.nvidia.yml.
    command: ["python", "scripts/training/train_by_family.py", "--family", "waveform-end-to-end", "--device-profile", "cpu", "--resume"]

  spectral-convolutional:
    <<: *train-common
    build:
      context: ../..
      dockerfile: docker/environments/tensorflow-keras/Dockerfile.cpu
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    image: xfakesong/tensorflow-keras:cpu
    container_name: xfakesong_spectral_convolutional_cpu
    # --resume: sem ele o `restart: on-failure` do bloco comum refazia as
    # arquiteturas JA concluidas a cada retomada, tornando a politica de
    # restart pior que nenhuma. Mesmo motivo documentado em
    # benchmark.nvidia.yml.
    command: ["python", "scripts/training/train_by_family.py", "--family", "spectral-convolutional", "--device-profile", "cpu", "--resume"]

  extended:
    <<: *train-common
    build:
      context: ../..
      dockerfile: docker/environments/tensorflow-keras/Dockerfile.cpu
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    image: xfakesong/tensorflow-keras:cpu
    container_name: xfakesong_extended_cpu
    # --resume: sem ele o `restart: on-failure` do bloco comum refazia as
    # arquiteturas JA concluidas a cada retomada, tornando a politica de
    # restart pior que nenhuma. Mesmo motivo documentado em
    # benchmark.nvidia.yml.
    command: ["python", "scripts/training/train_by_family.py", "--family", "extended", "--device-profile", "cpu", "--resume"]
  ssl-transformers:
    <<: *train-common
    build:
      context: ../..
      dockerfile: docker/environments/ssl-transformers/Dockerfile.cpu
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    image: xfakesong/ssl-transformers:cpu
    container_name: xfakesong_ssl_transformers_cpu
    # --resume: sem ele o `restart: on-failure` do bloco comum refazia as
    # arquiteturas JA concluidas a cada retomada, tornando a politica de
    # restart pior que nenhuma. Mesmo motivo documentado em
    # benchmark.nvidia.yml.
    command: ["python", "scripts/training/train_by_family.py", "--family", "ssl-pretrained", "--device-profile", "cpu", "--resume"]
